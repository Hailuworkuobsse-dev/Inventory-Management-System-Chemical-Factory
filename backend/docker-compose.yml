version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aims-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-aims_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aims_password}
      POSTGRES_DB: ${DB_NAME:-aims_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aims_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aims-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: aims-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aims-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aims-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-aims_user}:${DB_PASSWORD:-aims_password}@postgres:5432/${DB_NAME:-aims_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./logs:/app/logs
    networks:
      - aims-network
    restart: unless-stopped

  # MQTT Broker for IoT (optional)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aims-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    networks:
      - aims-network
    profiles:
      - iot

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mqtt_data:
    driver: local
  mqtt_log:
    driver: local

networks:
  aims-network:
    driver: bridge
